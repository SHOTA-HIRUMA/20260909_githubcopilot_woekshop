<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <main class="screen">
    <section class="timer-card" aria-label="ポモドーロタイマー">
      <header class="card-header">
        <h1>ポモドーロタイマー</h1>
        <div class="window-controls" aria-hidden="true">
          <span>-</span>
          <span>□</span>
          <span>×</span>
        </div>
      </header>

      <p class="session-label">作業中</p>

      <div id="timer-ring" class="timer-ring" role="img" aria-label="タイマー進捗 72%">
        <div class="timer-ring-inner">
          <p id="timer-text" class="timer-text">25:00</p>
        </div>
      </div>

      <div class="action-row">
        <button id="start-button" type="button" class="btn btn-primary">開始</button>
        <button id="reset-button" type="button" class="btn btn-secondary">リセット</button>
      </div>

      <section id="daily-progress" class="progress-panel" aria-label="今日の進捗">
        <h2>今日の進捗</h2>
        <div class="progress-grid">
          <div class="metric">
            <p class="metric-value">4</p>
            <p class="metric-label">完了</p>
          </div>
          <div class="metric">
            <p class="metric-value">1時間40分</p>
            <p class="metric-label">集中時間</p>
          </div>
        </div>
      </section>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
